[project]
name = "reservoir-exact-bench"
version = "1.0.0"
description = "Exact-rational prefix DP + Johnson-graph transportation-flow analysis of anytime-uniform reservoir samplers, with a matched Monte-Carlo uniformity baseline"
requires-python = ">=3.12"

# Every version below is the EXACT version installed in .venv for the run that produced
# method_out.json (transitive dependencies included), so the environment is reproducible
# byte for byte.  Recreate with:
#   uv venv .venv --python=3.12
#   uv pip install --python=.venv/bin/python -r <(python -c "import tomllib,sys;print('\n'.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))")
dependencies = [
  "attrs==26.1.0",
  "iniconfig==2.3.0",
  "jsonschema==4.26.0",
  "jsonschema-specifications==2025.9.1",
  "loguru==0.7.3",
  "mpmath==1.3.0",
  "networkx==3.6.1",
  "numpy==2.5.3",
  "packaging==26.3",
  "pluggy==1.6.0",
  "psutil==7.2.2",
  "Pygments==2.21.0",
  "pytest==9.1.1",
  "referencing==0.37.0",
  "rpds-py==2026.6.3",
  "scipy==1.18.1",
  "sympy==1.14.0",
  "typing_extensions==4.16.0",
]

[project.urls]
readme = "README.md"

[tool.reservoir-exact-bench]
# Direct imports, separated from the transitive closure above for readability.
direct-dependencies = [
  "numpy==2.5.3",       # vectorised Monte-Carlo harness and null bands
  "scipy==1.18.1",      # HiGHS (linprog / milp) and sparse max-flow
  "networkx==3.6.1",    # readable fallback graph utilities
  "sympy==1.14.0",      # exact rational rank check in forced.py
  "loguru==0.7.3",      # logging
  "pytest==9.1.1",      # gates G1..G8
  "psutil==7.2.2",      # hardware introspection
  "jsonschema==4.26.0", # local schema validation of method_out.json
]
python-version-used = "3.12.14"
gpu-required = false
llm-calls = 0
openrouter-spend-usd = 0.0
